<!-- ================= SLIDESHOW GALLERY ================= -->

<section class="section slideshow-section" id="gallery">

    <div class="container">

        <div class="section-title center">

            <span class="tag blue">
                GALLERY
            </span>

            <h2>
                Explore Our
                <span>Learning Environment</span>
            </h2>

        </div>


        <!-- SLIDESHOW CONTAINER -->
        <div class="slideshow-container">

            <!-- Slides -->
            <div class="slide fade">
                <img src="images/classroom-1.jpg" alt="Modern Classroom">
                <div class="slide-caption">Modern Classroom Environment</div>
            </div>

            <div class="slide fade">
                <img src="images/computer-lab.jpg" alt="Computer Lab">
                <div class="slide-caption">Well-Equipped Computer Lab</div>
            </div>

            <div class="slide fade">
                <img src="images/catering-kitchen.jpg" alt="Catering Kitchen">
                <div class="slide-caption">Professional Catering Kitchen</div>
            </div>

            <div class="slide fade">
                <img src="images/training-session.jpg" alt="Training Session">
                <div class="slide-caption">Hands-On Training Session</div>
            </div>

            <div class="slide fade">
                <img src="images/students-project.jpg" alt="Student Projects">
                <div class="slide-caption">Student Projects & Achievements</div>
            </div>

            <div class="slide fade">
                <img src="images/graduation.jpg" alt="Graduation Ceremony">
                <div class="slide-caption">Graduation & Certificate Awards</div>
            </div>

            <!-- Navigation Arrows -->
            <a class="prev" onclick="changeSlide(-1)">&#10094;</a>
            <a class="next" onclick="changeSlide(1)">&#10095;</a>

        </div>


        <!-- DOTS / INDICATORS -->
        <div class="dots-container">
            <span class="dot" onclick="currentSlide(1)"></span>
            <span class="dot" onclick="currentSlide(2)"></span>
            <span class="dot" onclick="currentSlide(3)"></span>
            <span class="dot" onclick="currentSlide(4)"></span>
            <span class="dot" onclick="currentSlide(5)"></span>
            <span class="dot" onclick="currentSlide(6)"></span>
        </div>

    </div>

</section>
